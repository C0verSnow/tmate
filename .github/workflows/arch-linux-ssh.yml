name: Arch Linux SSH

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: 只运行自动验证
        type: boolean
        default: false
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  arch-linux:
    name: Arch Linux
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      VERIFY_ONLY: ${{ github.event_name == 'pull_request' || inputs.verify_only }}
      TMATE_HOST: gha.warp.build
      TMATE_ED25519_FINGERPRINT: SHA256:+aWjAPAeKuvuZSPG92Q8yaEkd5eb2T+uF9Jp+8Sb/+A

    steps:
      - name: Install Arch Linux packages
        run: |
          . /etc/os-release
          test "$ID" = arch
          pacman -Syu --noconfirm --needed git openssh tmate

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Debugging with tmate
        id: tmate
        uses: mxschmitt/action-tmate@v3
        with:
          install-dependencies: false
          limit-access-to-actor: true
          detached: true
          connect-timeout-seconds: 1800
          tmate-server-host: ${{ env.TMATE_HOST }}
          tmate-server-port: 22
          tmate-server-rsa-fingerprint: SHA256:xx8GG3NVyIlZRFvm+a0N8U3NVXCIZXMsOnes0ERRz1k
          tmate-server-ed25519-fingerprint: ${{ env.TMATE_ED25519_FINGERPRINT }}

      - name: Verify SSH and show connection instructions
        env:
          SSH_ADDRESS: ${{ steps.tmate.outputs.ssh-address }}
        run: |
          known_hosts=$(mktemp)
          trap '
            status=$?
            rm -f "$known_hosts"
            if (( status != 0 )) || [[ "$VERIFY_ONLY" == true ]]; then
              touch /continue
            fi
          ' EXIT

          [[ "$SSH_ADDRESS" == ?*@"$TMATE_HOST" ]]
          tmate -S /tmp/tmate.sock has-session
          ssh-keyscan -T 10 -t ed25519 "$TMATE_HOST" > "$known_hosts"
          if [[ $(ssh-keygen -lf "$known_hosts" | awk '{print $2}' | sort -u) != "$TMATE_ED25519_FINGERPRINT" ]]; then
            echo 'SSH relay host key fingerprint does not match.' >&2
            exit 1
          fi
          if output=$(ssh -F /dev/null -o UserKnownHostsFile="$known_hosts" \
              -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o BatchMode=yes \
              -o HostKeyAlgorithms=ssh-ed25519 -o PreferredAuthentications=none \
              -T "$SSH_ADDRESS" 2>&1); then
            echo 'SSH unexpectedly accepted a connection without a private key.' >&2
            exit 1
          fi
          if [[ "$output" != *'Permission denied (publickey'* ]]; then
            printf '%s\n' "$output" >&2
            exit 1
          fi

          printf 'Authorized SSH key fingerprints for %s:\n' "$GITHUB_ACTOR"
          ssh-keygen -lf "$HOME/.ssh/authorized_keys" | awk '{print $2, $NF}'
          printf 'SSH relay fingerprint: %s\n' "$TMATE_ED25519_FINGERPRINT"
          printf 'SSH checks passed at %s UTC.\n' "$(date -u '+%Y-%m-%d %H:%M:%S')"
          if [[ "$VERIFY_ONLY" != true ]]; then
            printf '::notice title=SSH connection::ssh -o IdentitiesOnly=yes -o HostKeyAlgorithms=ssh-ed25519 -i "<private-key-path>" %s\n' "$SSH_ADDRESS"
          fi
